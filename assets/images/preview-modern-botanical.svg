<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610">
  <defs>
    <linearGradient id="botanicalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F6F4"/>
      <stop offset="50%" stop-color="#EBF0EC"/>
      <stop offset="100%" stop-color="#E2E8E4"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B4C2B8"/>
      <stop offset="50%" stop-color="#9EACA2"/>
      <stop offset="100%" stop-color="#7B8C80"/>
    </linearGradient>
    <pattern id="botanicalDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#9EACA2" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="360" height="610" fill="url(#botanicalBg)"/>
  <rect width="360" height="610" fill="url(#botanicalDots)"/>

  <!-- Ornate Border Frame -->
  <rect x="18" y="18" width="324" height="574" rx="16" fill="none" stroke="#9EACA2" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="24" y="24" width="312" height="562" rx="12" fill="none" stroke="#9EACA2" stroke-width="0.7" stroke-dasharray="3 3" stroke-opacity="0.3"/>

  <!-- Minimalist Decorative Botanical Leaf Icon at top -->
  <g transform="translate(160, 42)">
    <path d="M20 28 c0-7 -5-12 -12-12 c0-7 5-12 12-12 s12 5 12 12 c0 7 -5 12 -12 12 z" fill="none" stroke="#9EACA2" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="20" y2="16" stroke="#9EACA2" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Header Text -->
  <text x="180" y="92" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#2F3C33" letter-spacing="4">WE ARE GETTING MARRIED</text>

  <!-- Arch Frame Photo Placeholder -->
  <g transform="translate(110, 112)">
    <rect x="-4" y="-4" width="148" height="188" rx="74" fill="none" stroke="#9EACA2" stroke-width="1" stroke-opacity="0.4"/>
    <rect width="140" height="180" rx="70" fill="#FFFFFF" stroke="#9EACA2" stroke-width="1.5"/>
    <circle cx="70" cy="65" r="38" fill="#EBF0EC"/>
    <path d="M 35 155 C 35 110, 105 110, 105 155 Z" fill="#DCE5DF"/>
    <!-- Leaf badge inside photo -->
    <circle cx="70" cy="65" r="16" fill="#9EACA2" opacity="0.3"/>
    <path d="M 70 56 C 65 62, 70 70, 70 74 C 70 70, 75 62, 70 56 Z" fill="#2F3C33" opacity="0.7"/>
  </g>

  <!-- Couple Names -->
  <text x="180" y="340" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-style="italic" fill="#2F3C33">Kevin &amp; Laura</text>

  <!-- Wedding Date -->
  <text x="180" y="375" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10.5" fill="#4A5568" letter-spacing="3">SATURDAY, 24 OCT 2026</text>

  <!-- Countdown Pill Box -->
  <rect x="55" y="400" width="250" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#9EACA2" stroke-width="0.8" stroke-opacity="0.6"/>
  <g transform="translate(68, 412)">
    <!-- Days -->
    <text x="25" y="16" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#2F3C33">128</text>
    <text x="25" y="27" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#718096" letter-spacing="1">HARI</text>
    <!-- Hours -->
    <text x="80" y="16" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#2F3C33">14</text>
    <text x="80" y="27" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#718096" letter-spacing="1">JAM</text>
    <!-- Minutes -->
    <text x="135" y="16" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#2F3C33">30</text>
    <text x="135" y="27" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#718096" letter-spacing="1">MNT</text>
    <!-- Seconds -->
    <text x="190" y="16" text-anchor="middle" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#2F3C33">45</text>
    <text x="190" y="27" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#718096" letter-spacing="1">DTK</text>
  </g>

  <!-- Quote Snippet Card -->
  <rect x="40" y="468" width="280" height="45" rx="10" fill="#9EACA2" fill-opacity="0.12" stroke="#9EACA2" stroke-width="0.6"/>
  <text x="180" y="488" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#2F3C33">"Two souls with but a single thought,"</text>
  <text x="180" y="503" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" fill="#4A5568" letter-spacing="1.5">- JOHN KEATS -</text>

  <!-- Sage Green CTA button mockup -->
  <rect x="100" y="530" width="160" height="34" rx="17" fill="url(#sageGrad)" filter="drop-shadow(0 4px 6px rgba(158,172,162,0.4))"/>
  <text x="180" y="552" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" letter-spacing="2">BUKA UNDANGAN</text>
</svg>
